#               |_|        Liquid Glass Desktop
#
# Hyprland compositor config for ReqriumOS.

# ---------------------------------------------------------------- monitors ---
monitor = , preferred, auto, 1

# --------------------------------------------------------------- variables ---
$terminal    = kitty
$files       = thunar
$launcher    = rofi -show drun -theme ~/.config/rofi/glass.rasi
$scripts     = ~/.config/reqrium/scripts
$mod         = SUPER

# --------------------------------------------------------------- autostart ---
exec-once = $scripts/wallpaper.sh init
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = nm-applet --indicator
exec-once = wl-paste --watch cliphist store

# --------------------------------------------------------------- environment -
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,ReqriumOS

# ------------------------------------------------------------------ layout ---
general {
    gaps_in  = 6
    gaps_out = 14
    border_size = 2

    # Light "glass edge" that slowly rotates around the active window.
    col.active_border   = rgba(c4b5fdee) rgba(7dd3fcee) rgba(f0abfcee) 45deg
    col.inactive_border = rgba(ffffff22)

    resize_on_border = true
    layout = dwindle
}

# ---------------------------------------------------------- liquid glass -----
decoration {
    rounding = 18
    rounding_power = 3.0          # squircle-style corners

    active_opacity   = 0.90
    inactive_opacity = 0.80
    fullscreen_opacity = 1.0

    dim_inactive = true
    dim_strength = 0.06

    blur {
        enabled = true
        size    = 9
        passes  = 4               # more passes = creamier frosted glass
        noise   = 0.018           # subtle grain stops it looking like plastic
        contrast   = 1.15
        brightness = 1.05
        vibrancy          = 0.42  # pushes the colours behind the glass through
        vibrancy_darkness = 0.25
        popups  = true
        popups_ignorealpha = 0.2
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 32
        render_power = 3
        offset = 0 8
        color = rgba(05031aaa)
        color_inactive = rgba(05031a55)
    }
}

# --------------------------------------------------------------- animations --
animations {
    enabled = true

    # Custom curves
    bezier = liquid,    0.22, 1.00, 0.36, 1.00   # fast start, long silky settle
    bezier = jelly,     0.34, 1.56, 0.64, 1.00   # overshoots and bounces back
    bezier = drip,      0.55, 0.00, 0.10, 1.00
    bezier = smooth,    0.25, 0.10, 0.25, 1.00
    bezier = linear,    0.00, 0.00, 1.00, 1.00

    # Windows wobble in like a droplet and sink away on close
    animation = windowsIn,    1, 5,  jelly,  popin 70%
    animation = windowsOut,   1, 4,  drip,   popin 85%
    animation = windowsMove,  1, 5,  liquid, slide
    animation = fadeIn,       1, 5,  smooth
    animation = fadeOut,      1, 4,  smooth
    animation = fadeSwitch,   1, 6,  smooth
    animation = fadeDim,      1, 6,  smooth

    # Panels, launcher and notifications float in
    animation = layersIn,     1, 4,  jelly,  popin 90%
    animation = layersOut,    1, 3,  drip,   fade
    animation = fadeLayersIn, 1, 4,  smooth

    # The rotating gradient border ("light moving through glass")
    animation = border,       1, 10, smooth
    animation = borderangle,  1, 90, linear, loop

    # Workspaces glide vertically with a fade
    animation = workspaces,        1, 6, liquid, slidefadevert 25%
    animation = specialWorkspace,  1, 5, jelly,  slidefadevert 40%
}

# ---------------------------------------------------------- layer blur -------
# Make the panel, launcher, notifications and lock screen real glass.
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, rofi
layerrule = ignorezero, rofi
layerrule = blur, notifications
layerrule = ignorezero, notifications
layerrule = blur, logout_dialog

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(0b0a1f)
    animate_manual_resizes = true
    animate_mouse_windowdragging = true
    vfr = true
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

gestures {
    workspace_swipe = true
    workspace_swipe_cancel_ratio = 0.3
}

# -------------------------------------------------------------- keybinds -----
bind = $mod, Return, exec, $terminal
bind = $mod, Space,  exec, $launcher
bind = $mod, E,      exec, $files
bind = $mod, Q,      killactive
bind = $mod, F,      fullscreen
bind = $mod, V,      togglefloating
bind = $mod, P,      pseudo
bind = $mod, J,      togglesplit
bind = $mod, L,      exec, hyprlock
bind = $mod, W,      exec, $scripts/wallpaper.sh next
bind = $mod, C,      exec, cliphist list | rofi -dmenu -theme ~/.config/rofi/glass.rasi | cliphist decode | wl-copy
bind = $mod SHIFT, E, exec, $scripts/powermenu.sh
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot copied"
bind = , Print,       exec, grim - | wl-copy && notify-send "Screenshot copied"

# Focus
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Workspaces 1-9
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Scratchpad ("glass drawer")
bind = $mod, S,       togglespecialworkspace, drawer
bind = $mod ALT, S,   movetoworkspace, special:drawer

# Mouse move / resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media / hardware keys
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
