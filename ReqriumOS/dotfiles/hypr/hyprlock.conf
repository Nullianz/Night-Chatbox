# ReqriumOS lock screen: a frosted pane over the blurred desktop.

general {
    hide_cursor = true
    grace = 2
}

animations {
    enabled = true
    bezier = liquid, 0.22, 1.00, 0.36, 1.00
    animation = fadeIn,  1, 5, liquid
    animation = fadeOut, 1, 5, liquid
    animation = inputFieldDots, 1, 2, liquid
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 1.1
    brightness = 0.75
    vibrancy = 0.35
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ffffffee)
    font_size = 110
    font_family = Inter Display Light
    position = 0, 220
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date +'%A, %d %B')"
    color = rgba(ffffffaa)
    font_size = 20
    font_family = Inter
    position = 0, 120
    halign = center
    valign = center
}

# Glass password pill
input-field {
    monitor =
    size = 340, 58
    rounding = 29
    outline_thickness = 2
    outer_color = rgba(ffffff40) rgba(7dd3fc60) 45deg
    inner_color = rgba(ffffff18)
    font_color  = rgba(ffffffee)
    check_color = rgba(7dd3fccc) rgba(c4b5fdcc) 45deg
    fail_color  = rgba(fb7185cc)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff88">Password</span>
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 2
}

label {
    monitor =
    text = ReqriumOS
    color = rgba(ffffff66)
    font_size = 13
    font_family = Inter SemiBold
    position = 0, 40
    halign = center
    valign = bottom
}
