# ReqriumOS terminal: translucent, so Hyprland's blur shows through.
font_family      JetBrainsMono Nerd Font
font_size        11.5
background_opacity 0.72
background_blur 0
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0
cursor_shape beam
cursor_trail 3
cursor_trail_decay 0.1 0.4
enable_audio_bell no

# Reqrium Night palette
foreground #e7e5ff
background #0f0c29
selection_background #3b2f7a
cursor #7dd3fc
color0  #1e1b3a
color8  #4c4673
color1  #fb7185
color9  #fda4af
color2  #6ee7b7
color10 #a7f3d0
color3  #fcd34d
color11 #fde68a
color4  #7dd3fc
color12 #bae6fd
color5  #c4b5fd
color13 #ddd6fe
color6  #5eead4
color14 #99f6e4
color7  #e7e5ff
color15 #ffffff
