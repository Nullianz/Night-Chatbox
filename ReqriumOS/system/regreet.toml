# ReqriumOS login screen (ReGreet)
[background]
path = "/usr/share/backgrounds/reqriumos/liquid-night.png"
fit = "Cover"

[GTK]
application_prefer_dark_theme = true
cursor_theme_name = "Adwaita"
font_name = "Inter 13"
icon_theme_name = "Papirus-Dark"
theme_name = "adw-gtk3-dark"

[commands]
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]

[appearance]
greeting_msg = "Welcome to ReqriumOS"

[widget.clock]
format = "%A %d %B   %H:%M"
resolution = "500ms"
label_width = 320
